<!DOCTYPE html>
<html>

<head>
    <title>Delight Dhaba - Order Online</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #f4f6f9;
        }

        header {
            background: linear-gradient(135deg, #ff6b6b, #ff4757);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 20px;
        }

        h2 {
            margin-top: 40px;
            border-left: 6px solid #ff4757;
            padding-left: 10px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }

        .menu-card {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            transition: 0.2s ease;
        }

        .menu-card:hover {
            transform: translateY(-5px);
        }

        .price {
            color: #ff4757;
            font-weight: bold;
            margin-top: 5px;
        }

        button {
            margin-top: 10px;
            padding: 8px 12px;
            background: #2ed573;
            border: none;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .cart {
            position: fixed;
            right: 20px;
            bottom: 20px;
            background: white;
            padding: 20px;
            width: 300px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
        }

        @media(max-width: 768px) {
            .cart {
                position: static;
                width: 100%;
                margin-top: 20px;
            }
        }
    </style>
</head>

<body>

    <header>
        Delight Dhaba - Order Online
    </header>

    <div class="container" id="menuContainer"></div>

    <div class="cart">
        <h3>Your Cart</h3>
        <div id="cartItems"></div>
        <p><strong>Total: ₹<span id="total">0</span></strong></p>

        <input type="text" id="name" placeholder="Your Name">
        <input type="text" id="phone" placeholder="Phone">
        <input type="text" id="address" placeholder="Delivery Address">

        <button onclick="placeOrder()">Place Order</button>
    </div>

    <script>

        // 🔥 CATEGORY BASED MENU
        const menu = {
            "Paneer Items": [
                { name: "Paneer Butter Masala", price: 190 },
                { name: " Paneer butter masala sp", price: 220 },
                { name: "palak paneer ", price: 110 },
                { name: "palak paneer sp", price: 140 },
                { name: "methi chaman", price: 190 },
                { name: "methi chaman sp", price: 220 },
                { name: "paneer mushroom", price: 200 },
                { name: "paneer chana masala ", price: 170 },
                { name: "paneer malai kofti ", price: 200 }



            ],
            "Kaju Items": [
                { name: "kaju tomato", price: 190 },
                { name: "Kaju tomato sp", price: 220 },
                { name: "kaju paneer", price: 220 },
                { name: "kaju mushroom ", price: 200 },
                { name: "kaju palak", price: 170 },
                { name: "kaju chana masala", price: 170 },
                { name: "kaju malai kofta", price: 200 }
            ],
            "Veg Curries": [
                { name: "palak", price: 100 },
                { name: "dal", price: 100 },
                { name: "Dal mahani", price: 110 },
                { name: "chana masala", price: 120 },
                { name: "aloo bataani", price: 100 },
                { name: "kadai pakodi", price: 100 },
                { name: "tomato curry", price: 100 },
                { name: "all mixture ", price: 180 },
                { name: "mushroom curry", price: 180 },
                { name: "malai kofta ", price: 180 }






            ],
            "Pulka ": [
                { name: "pulka", price: 8 }

            ],
            "Parathas": [
                { name: "Aloo Paratha", price: 40 },
                { name: "sada Paratha", price: 40 },
                { name: "papad", price: 25 },
                { name: "masala papad", price: 40 },


            ]
        };

        let cart = [];

        function renderMenu() {
            const container = document.getElementById("menuContainer");

            Object.keys(menu).forEach(category => {

                const section = document.createElement("div");

                section.innerHTML = `<h2>${category}</h2>`;

                const grid = document.createElement("div");
                grid.className = "menu-grid";

                menu[category].forEach((item) => {

                    const card = document.createElement("div");
                    card.className = "menu-card";

                    card.innerHTML = `
        <h3>${item.name}</h3>
        <p class="price">₹${item.price}</p>
        <button onclick="addToCart('${item.name}', ${item.price})">
          Add to Cart
        </button>
      `;

                    grid.appendChild(card);
                });

                section.appendChild(grid);
                container.appendChild(section);
            });
        }

        function addToCart(name, price) {
            const existing = cart.find(i => i.name === name);

            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({ name, price, quantity: 1 });
            }

            renderCart();
        }

        function renderCart() {
            const container = document.getElementById("cartItems");
            container.innerHTML = "";

            let total = 0;

            cart.forEach(item => {
                total += item.price * item.quantity;
                container.innerHTML += `<p>${item.name} x ${item.quantity}</p>`;
            });

            document.getElementById("total").innerText = total;
        }

        async function placeOrder() {
            const name = document.getElementById("name").value;
            const phone = document.getElementById("phone").value;
            const address = document.getElementById("address").value;

            if (!name || !phone || !address || cart.length === 0) {
                alert("Please fill details and add items.");
                return;
            }

            const totalAmount = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);

            const response = await fetch("/api/orders/create", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    customerName: name,
                    phone: phone,
                    orderType: "delivery",
                    address: address,
                    items: cart,
                    totalAmount: totalAmount
                })
            });

            const data = await response.json();

            alert("Order placed! Order No: " + data.orderNumber);

            cart = [];
            renderCart();
            document.getElementById("name").value = "";
            document.getElementById("phone").value = "";
            document.getElementById("address").value = "";
        }

        renderMenu();
        renderCart();

    </script>

</body>

</html>
