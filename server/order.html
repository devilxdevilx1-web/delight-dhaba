<!DOCTYPE html>
<html>

<head>
    <title>Delight Dhaba - Order Online</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #f4f6f9;
        }

        header {
            background: linear-gradient(135deg, #ff6b6b, #ff4757);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 20px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .menu-card {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            transition: 0.2s ease;
        }

        .menu-card:hover {
            transform: translateY(-5px);
        }

        .price {
            color: #ff4757;
            font-weight: bold;
            margin-top: 5px;
        }

        button {
            margin-top: 10px;
            padding: 8px 12px;
            background: #2ed573;
            border: none;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #20bf6b;
        }

        .cart {
            position: fixed;
            right: 20px;
            bottom: 20px;
            background: white;
            padding: 20px;
            width: 300px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .cart h3 {
            margin-top: 0;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
        }

        @media(max-width: 768px) {
            .cart {
                position: static;
                width: 100%;
                margin-top: 20px;
            }
        }
    </style>
</head>

<body>

    <header>
        Delight Dhaba - Order Online
    </header>

    <div class="container">

        <h2>Menu</h2>

        <div class="menu-grid" id="menuGrid"></div>

    </div>

    <div class="cart">
        <h3>Your Cart</h3>
        <div id="cartItems"></div>
        <p><strong>Total: ₹<span id="total">0</span></strong></p>

        <input type="text" id="name" placeholder="Your Name">
        <input type="text" id="phone" placeholder="Phone">
        <input type="text" id="address" placeholder="Delivery Address">

        <button onclick="placeOrder()">Place Order</button>
    </div>

    <script>

        // 🔥 FULL MENU LIST
        const menu = [
            { name: "Paneer Butter Masala", price: 250 },
            { name: "Shahi Paneer", price: 260 },
            { name: "Dal Tadka", price: 180 },
            { name: "Jeera Rice", price: 150 },
            { name: "Butter Naan", price: 40 },
            { name: "Tandoori Roti", price: 25 },
            { name: "Veg Biryani", price: 220 },
            { name: "Chilli Paneer", price: 240 }
        ];

        let cart = [];

        function renderMenu() {
            const grid = document.getElementById("menuGrid");

            menu.forEach((item, index) => {
                const card = document.createElement("div");
                card.className = "menu-card";

                card.innerHTML = `
      <h3>${item.name}</h3>
      <p class="price">₹${item.price}</p>
      <button onclick="addToCart(${index})">Add to Cart</button>
    `;

                grid.appendChild(card);
            });
        }

        function addToCart(index) {
            const item = menu[index];
            const existing = cart.find(i => i.name === item.name);

            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({ ...item, quantity: 1 });
            }

            renderCart();
        }

        function renderCart() {
            const container = document.getElementById("cartItems");
            container.innerHTML = "";

            let total = 0;

            cart.forEach(item => {
                total += item.price * item.quantity;

                container.innerHTML += `
      <p>${item.name} x ${item.quantity}</p>
    `;
            });

            document.getElementById("total").innerText = total;
        }

        async function placeOrder() {

            const name = document.getElementById("name").value;
            const phone = document.getElementById("phone").value;
            const address = document.getElementById("address").value;
            body: JSON.stringify({
                user: localStorage.getItem("userId"),
                customerName: name,
                phone: phone,
                orderType: "delivery",
                address: address,
                items: cart,
                totalAmount: totalAmount
            })

            if (!name || !phone || !address || cart.length === 0) {
                alert("Please fill details and add items.");
                return;
            }

            const totalAmount = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);

            const response = await fetch("/api/orders/create", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    customerName: name,
                    phone: phone,
                    orderType: "delivery",
                    address: address,
                    items: cart,
                    totalAmount: totalAmount
                })
            });

            const data = await response.json();

            alert("Order placed! Order No: " + data.orderNumber);

            cart = [];
            renderCart();
            document.getElementById("name").value = "";
            document.getElementById("phone").value = "";
            document.getElementById("address").value = "";
        }

        renderMenu();
        renderCart();

    </script>

</body>

</html>
