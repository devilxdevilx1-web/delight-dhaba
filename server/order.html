<!DOCTYPE html>
<html>

<head>
    <title>Delight Dhaba - Order Online</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #f4f6f9;
            animation: fadeIn 0.6s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        header {
            background: linear-gradient(135deg, #ff6b6b, #ff4757);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            animation: slideDown 0.6s ease-out;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 20px;
        }

        h2 {
            margin-top: 40px;
            border-left: 6px solid #ff4757;
            padding-left: 10px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }

        .menu-card {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            animation: fadeUp 0.5s ease forwards;
        }

        @keyframes fadeUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .menu-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.15);
        }

        .price {
            color: #ff4757;
            font-weight: bold;
            margin-top: 5px;
        }

        button {
            margin-top: 10px;
            padding: 8px 12px;
            background: #2ed573;
            border: none;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        button:hover {
            background: #20bf6b;
            transform: scale(1.05);
        }

        .cart {
            position: fixed;
            right: 20px;
            bottom: 20px;
            background: white;
            padding: 20px;
            width: 300px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            animation: slideIn 0.6s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
        }

        .cart-item {
            animation: pop 0.3s ease;
        }

        @keyframes pop {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @media(max-width: 768px) {
            .cart {
                position: static;
                width: 100%;
                margin-top: 20px;
            }
        }
    </style>
</head>

<body>
    
    


    <header>
        Delight Dhaba - Order Online
    </header>

    <div class="container" id="menuContainer"></div>

    <div class="cart">
        <h3>Your Cart</h3>
        <div id="cartItems"></div>
        <p><strong>Total: ₹<span id="total">0</span></strong></p>

        <input type="text" id="name" placeholder="Your Name">
        <input type="text" id="phone" placeholder="Phone">
        <input type="text" id="address" placeholder="Delivery Address">

        <button onclick="placeOrder()">Place Order</button>
    </div>

    <script>

        const menu = {
            "Paneer Items": [
                { name: "Paneer Butter Masala", price: 250 },
                { name: "Shahi Paneer", price: 260 }
            ],
            "Kaju Items": [
                { name: "Kaju Masala", price: 280 }
            ],
            "Veg Curries": [
                { name: "Mix Veg Curry", price: 200 },
                { name: "Dal Tadka", price: 180 }
            ],
            "Pulka & Roti": [
                { name: "Tandoori Roti", price: 25 }
            ],
            "Parathas": [
                { name: "Aloo Paratha", price: 60 }
            ]
        };

        let cart = [];

        function renderMenu() {
            const container = document.getElementById("menuContainer");

            Object.keys(menu).forEach(category => {

                const section = document.createElement("div");
                section.innerHTML = `<h2>${category}</h2>`;

                const grid = document.createElement("div");
                grid.className = "menu-grid";

                menu[category].forEach(item => {

                    const card = document.createElement("div");
                    card.className = "menu-card";

                    card.innerHTML = `
        <h3>${item.name}</h3>
        <p class="price">₹${item.price}</p>
        <button onclick="addToCart('${item.name}', ${item.price})">
          Add to Cart
        </button>
      `;

                    grid.appendChild(card);
                });

                section.appendChild(grid);
                container.appendChild(section);
            });
        }

        function addToCart(name, price) {
            const existing = cart.find(i => i.name === name);

            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({ name, price, quantity: 1 });
            }

            renderCart();
        }

        function renderCart() {
            const container = document.getElementById("cartItems");
            container.innerHTML = "";

            let total = 0;

            cart.forEach(item => {
                total += item.price * item.quantity;
                container.innerHTML += `<p class="cart-item">${item.name} x ${item.quantity}</p>`;
            });

            document.getElementById("total").innerText = total;
        }

        async function placeOrder() {
            const name = document.getElementById("name").value;
            const phone = document.getElementById("phone").value;
            const address = document.getElementById("address").value;

            if (!name || !phone || !address || cart.length === 0) {
                alert("Please fill details and add items.");
                return;
            }

            const totalAmount = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);

            const response = await fetch("/api/orders/create", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    customerName: name,
                    phone: phone,
                    orderType: "delivery",
                    address: address,
                    items: cart,
                    totalAmount: totalAmount
                })
            });

            const data = await response.json();

            alert("Order placed! Order No: " + data.orderNumber);

            cart = [];
            renderCart();
            document.getElementById("name").value = "";
            document.getElementById("phone").value = "";
            document.getElementById("address").value = "";
        }
        // Auto-fill if logged in
        window.onload = function () {
            const name = localStorage.getItem("name");
            const phone = localStorage.getItem("phone");

            if (name) document.getElementById("name").value = name;
            if (phone) document.getElementById("phone").value = phone;
        };
        renderMenu();
        renderCart();

    </script>

</body>

</html>
