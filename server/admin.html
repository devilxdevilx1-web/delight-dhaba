<!DOCTYPE html>
<html>

<head>
    <title>Delight Dhaba Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #f5f6fa;
        }

        header {
            background: linear-gradient(135deg, #2f3542, #1e272e);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .container {
            padding: 20px;
            max-width: 1000px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            transition: 0.2s ease;
        }

        .card:hover {
            transform: translateY(-3px);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            color: white;
        }

        .pending {
            background: #ffa502;
        }

        .completed {
            background: #2ed573;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }

        .complete-btn {
            background: #2ed573;
            color: white;
        }

        .complete-btn:hover {
            background: #20bf6b;
        }

        ul {
            padding-left: 20px;
        }

        @media(max-width: 600px) {
            .order-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

    <header>
        Delight Dhaba Admin Panel
    </header>

    <div class="container" id="ordersContainer">
    </div>

    <script>
        async function loadOrders() {
            const res = await fetch("/api/orders/all");
            const orders = await res.json();

            const container = document.getElementById("ordersContainer");
            container.innerHTML = "";

            orders.forEach(order => {

                const card = document.createElement("div");
                card.className = "card";

                const statusClass = order.orderStatus === "completed" ? "completed" : "pending";

                card.innerHTML = `
      <div class="order-header">
        <h3>Order #${order.orderNumber}</h3>
        <span class="badge ${statusClass}">${order.orderStatus}</span>
      </div>

      <p><strong>Name:</strong> ${order.customerName}</p>
      <p><strong>Phone:</strong> ${order.phone}</p>
      <p><strong>Address:</strong> ${order.address}</p>
      <p><strong>Total:</strong> ₹${order.totalAmount}</p>

      <strong>Items:</strong>
      <ul>
        ${order.items.map(item => `
          <li>${item.name} x ${item.quantity} (₹${item.price})</li>
        `).join("")}
      </ul>

      ${order.orderStatus !== "completed"
                        ? `<button class="complete-btn" onclick="markCompleted('${order._id}')">Mark as Completed</button>`
                        : ""
                    }
    `;

                container.appendChild(card);
            });
        }

        async function markCompleted(id) {
            await fetch("/api/orders/update/" + id, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ status: "completed" })
            });

            loadOrders();
        }

        loadOrders();
        setInterval(loadOrders, 5000);
    </script>

</body>

</html>
