<!DOCTYPE html>
<html>

<head>
    <title>Delight Dhaba Admin</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .order {
            background: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .completed {
            opacity: 0.5;
        }

        button {
            padding: 8px 12px;
            background: green;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background: darkgreen;
        }
    </style>
</head>

<body>

    <h1>Delight Dhaba Admin Panel</h1>

    <div id="orders"></div>

    <script>
        const BASE_URL = "https://delight-dhaba.onrender.com";

        async function loadOrders() {
            const res = await fetch(BASE_URL + "/api/orders/all");
            const data = await res.json();

            const container = document.getElementById("orders");
            container.innerHTML = "";

            data.forEach(order => {

                const div = document.createElement("div");
                div.className = "order";

                if (order.orderStatus === "completed") {
                    div.classList.add("completed");
                }

                div.innerHTML = `
      <h3>Order #${order.orderNumber}</h3>
      <p><strong>Name:</strong> ${order.customerName}</p>
      <p><strong>Phone:</strong> ${order.phone}</p>
      <p><strong>Address:</strong> ${order.address}</p>
      <p><strong>Total:</strong> ₹${order.totalAmount}</p>
      <p><strong>Status:</strong> ${order.orderStatus}</p>
      <p><strong>Items:</strong></p>
      <ul>
        ${order.items.map(item => `
          <li>${item.name} x ${item.quantity} (₹${item.price})</li>
        `).join("")}
      </ul>
      ${order.orderStatus === "pending"
                        ? `<button onclick="markCompleted('${order._id}')">Mark as Completed</button>`
                        : ""}
    `;

                container.appendChild(div);
            });
        }

        async function markCompleted(id) {
            await fetch(BASE_URL + "/api/orders/complete/" + id, {
                method: "PUT"
            });

            loadOrders();
        }

        loadOrders();
        setInterval(loadOrders, 5000);
    </script>

</body>

</html>
