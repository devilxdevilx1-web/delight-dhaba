<!DOCTYPE html>
<html>

<head>
    <title>Delight Dhaba Admin</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        h2 {
            margin-top: 40px;
        }

        .order {
            background: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .completed {
            opacity: 0.6;
        }

        button {
            padding: 8px 12px;
            background: green;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background: darkgreen;
        }

        #loginBox {
            max-width: 300px;
            margin: 100px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        input {
            padding: 8px;
            width: 100%;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

    <div id="loginBox">
        <h2>Admin Login</h2>
        <input type="password" id="password" placeholder="Enter password" />
        <button onclick="login()">Login</button>
    </div>

    <div id="adminPanel" style="display:none;">
        <h1>Delight Dhaba Admin Panel</h1>

        <h2>🟢 Pending Orders</h2>
        <div id="pendingOrders"></div>

        <h2>✅ Completed Orders</h2>
        <div id="completedOrders"></div>
    </div>

    <script>
        const BASE_URL = "https://delight-dhaba.onrender.com";
        const ADMIN_PASSWORD = "1234"; // 🔥 Change this later

        function login() {
            const entered = document.getElementById("password").value;

            if (entered === ADMIN_PASSWORD) {
                document.getElementById("loginBox").style.display = "none";
                document.getElementById("adminPanel").style.display = "block";
                loadOrders();
                setInterval(loadOrders, 5000);
            } else {
                alert("Wrong password");
            }
        }

        async function loadOrders() {
            const res = await fetch(BASE_URL + "/api/orders/all");
            const data = await res.json();

            const pendingContainer = document.getElementById("pendingOrders");
            const completedContainer = document.getElementById("completedOrders");

            pendingContainer.innerHTML = "";
            completedContainer.innerHTML = "";

            // Sort newest first
            data.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

            data.forEach(order => {

                const div = document.createElement("div");
                div.className = "order";

                div.innerHTML = `
      <h3>Order #${order.orderNumber}</h3>
      <p><strong>Name:</strong> ${order.customerName}</p>
      <p><strong>Phone:</strong> ${order.phone}</p>
      <p><strong>Address:</strong> ${order.address}</p>
      <p><strong>Total:</strong> ₹${order.totalAmount}</p>
      <p><strong>Status:</strong> ${order.orderStatus}</p>
      <p><strong>Items:</strong></p>
      <ul>
        ${order.items.map(item => `
          <li>${item.name} x ${item.quantity} (₹${item.price})</li>
        `).join("")}
      </ul>
      ${order.orderStatus === "pending"
                        ? `<button onclick="markCompleted('${order._id}')">Mark as Completed</button>`
                        : ""}
    `;

                if (order.orderStatus === "pending") {
                    pendingContainer.appendChild(div);
                } else {
                    div.classList.add("completed");
                    completedContainer.appendChild(div);
                }
            });
        }

        async function markCompleted(id) {
            await fetch(BASE_URL + "/api/orders/complete/" + id, {
                method: "PUT"
            });

            loadOrders();
        }
    </script>

</body>

</html>
